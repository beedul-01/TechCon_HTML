<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechCon 2024</title>
</head>
<body>
    <header>
       <p><h1>Register for TechCon 2024</h1></p>
       <nav>
            <ul>
                <li><a href="about.html">About Us</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
       </nav>
    </header>
    <main>
        <form action="/submit-form" method="post">
            <label for="Fullname">Fullname :</label>
            <input type="text" id="Fullname" name="Fullname" placeholder="input your fullname">

            <label for="email">email :</label>
            <input type="email" id="email" name="email" placeholder="....@gmail.com">

            <label for="password">Password :</label>
            <input type="password"  id="password" name="password" placeholder="-">

            <label for="confirm password">Confirm password :</label>
            <input type="password" id="confirm password" name="confirm password" placeholder="-"><br>

            <label for="Term & Conditions">Accept terms and Conditions? </label>
            <input type="checkbox" id="Terms & Conditions" name="terms & condition" placeholder="do you accept our terms and conditions">

            <button type="submit">Register now</button>
        </form>
    </main>
    <footer>
        <p> &copy; TechCon 2025</p>
    </footer>
</body>
</html>
